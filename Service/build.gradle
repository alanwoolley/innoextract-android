plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.dokka'
    id 'maven-publish'
    id 'signing'
}

ext {
    GROUP_ID = "uk.co.armedpineapple.innoextract"
    ARTIFACT_ID = "service"
    VERSION = "2.1.0"
    SITE_URL = 'https://github.com/alanwoolley/innoextract-android'
    GIT_URL = 'https://github.com/alanwoolley/innoextract-android.git'
}

version = ext.VERSION
group = ext.GROUP_ID

android {
    compileSdk = 37

    namespace = 'uk.co.armedpineapple.innoextract.service'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    defaultConfig {
        minSdk = 26

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        aarMetadata {
            minCompileSdk = 26
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = 'jni/Android.mk'
        }
    }
    lint {
        abortOnError = false
        targetSdk = 37
    }
    testOptions {
        targetSdk = 37
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation "com.lazygeniouz:dfc:1.6"

    // Hilt
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hilt_version}"
    kapt "com.google.dagger:hilt-compiler:${rootProject.ext.hilt_version}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}"
}

apply from: 'versioning.gradle'
apply from: 'publish.gradle'
